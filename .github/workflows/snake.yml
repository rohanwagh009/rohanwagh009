# [!CORRECTED]
name: Generate Snake Animation

on:
  # Runs every 12 hours
  schedule:
    - cron: "0 */12 * * *" # [!FIX] Corrected to run ONCE every 12 hours, not every minute

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # [!FIX] Added the missing checkout step
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          
          # [!FIX] Palette is now a separate option, not part of the filename
          palette: github-dark
          
          # The output file will be saved in the dist folder
          outputs: dist/snake.svg

      - name: Push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
